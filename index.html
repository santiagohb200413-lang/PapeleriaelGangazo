<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Íconos reutilizables -->
<svg style="display:none">
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="ic-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></symbol>
  <symbol id="ic-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="21"/></symbol>
  <symbol id="ic-book" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="3" x2="8" y2="21"/></symbol>
  <symbol id="ic-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
  <symbol id="ic-drop" viewBox="0 0 24 24"><path d="M12 2s7 7.5 7 12a7 7 0 01-14 0c0-4.5 7-12 7-12z"/></symbol>
  <symbol id="ic-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></symbol>
  <symbol id="ic-bag" viewBox="0 0 24 24"><path d="M6 8a3 3 0 016 0"/><rect x="4" y="8" width="16" height="13" rx="2"/></symbol>
  <symbol id="ic-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="1"/><rect x="3" y="8" width="18" height="4"/><line x1="12" y1="8" x2="12" y2="21"/><path d="M12 8c-2 0-3-1.3-3-2.5S9.7 3 11 3c1.5 0 1 3 1 5z"/><path d="M12 8c2 0 3-1.3 3-2.5S14.3 3 13 3c-1.5 0-1 3-1 5z"/></symbol>
  <symbol id="ic-ruler" viewBox="0 0 24 24"><path d="M3 16l5-5 13 13-5 5z"/><line x1="10.5" y1="8.5" x2="12.5" y2="10.5"/><line x1="13.5" y1="5.5" x2="15.5" y2="7.5"/></symbol>
  <symbol id="ic-printer" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><rect x="6" y="14" width="12" height="8"/><path d="M2 9h20v7h-4"/></symbol>
  <symbol id="ic-tag" viewBox="0 0 24 24"><path d="M20.6 12.6L12 21.2 2.8 12A2 2 0 012.2 10.6L3.4 3.4 10.6 2.2A2 2 0 0112 2.8L20.6 11.4a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.2"/></symbol>
</svg>

<header>
  <div class="header-inner wrap">
    <div class="brand">
      <div class="logo" id="logo">--</div>
      <div>
        <div class="brand-name" id="brand-name">Cargando...</div>
        <div class="brand-tag" id="brand-tag"></div>
      </div>
    </div>
    <a class="wa-btn" id="wa-header" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.6-1.5-.8-2-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.2L2 22l4.9-1.4c1.5.8 3.2 1.3 5.1 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.2.9.9-3.1-.2-.3C3.5 14 3 12.5 3 11c0-5 4-9 9-9s9 4 9 9-4 9-9 9z"/></svg>
      Escríbenos
    </a>
  </div>
  <div class="banner" id="banner"></div>
</header>

<div class="wrap">

  <div class="search-section">
    <div class="search-bar">
      <svg class="icon" viewBox="0 0 24 24"><use href="#ic-search"/></svg>
      <input type="text" id="buscador" placeholder="Buscar productos...">
    </div>
  </div>

  <div class="cat-section">
    <div class="cat-title">Categorías</div>
    <div class="cat-rail" id="cat-rail">
      <!-- se llena con JS -->
    </div>
  </div>

  <div class="products-header">
    <h2>Productos</h2>
    <span id="contador"></span>
  </div>

  <div class="grid" id="grid">
    <!-- se llena con JS -->
  </div>

  <div class="empty-state" id="empty-state" style="display:none;">
    No encontramos productos con ese criterio. Prueba con otra palabra o categoría.
  </div>

  <footer>
    <div class="footer-note" id="footer-note"></div>
  </footer>

</div>

<!-- ---------- MODAL DE DETALLE DE PRODUCTO ---------- -->
<div class="detalle-overlay" id="detalle-overlay" onclick="if(event.target===this) cerrarDetalleProducto()">
  <div class="detalle-modal">
    <button class="detalle-close" onclick="cerrarDetalleProducto()">✕</button>
    <div class="detalle-img" id="detalle-img"></div>
    <div class="detalle-body">
      <div class="detalle-fila">
        <span class="detalle-label">Categoría:</span>
        <span class="detalle-valor" id="detalle-cat"></span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Producto:</span>
        <span class="detalle-valor detalle-nombre" id="detalle-nombre"></span>
      </div>
      <div class="detalle-fila" id="detalle-desc-fila">
        <span class="detalle-label">Descripción:</span>
        <span class="detalle-valor" id="detalle-desc"></span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Precio:</span>
        <span class="detalle-valor detalle-precio" id="detalle-precio"></span>
      </div>
      <div class="detalle-fila" id="detalle-mayor-fila">
        <span class="detalle-label">Al por mayor:</span>
        <span class="detalle-valor" id="detalle-precio-mayor"></span>
      </div>
      <a class="wa-btn detalle-wa" id="detalle-wa" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.6-1.5-.8-2-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.2L2 22l4.9-1.4c1.5.8 3.2 1.3 5.1 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.2.9.9-3.1-.2-.3C3.5 14 3 12.5 3 11c0-5 4-9 9-9s9 4 9 9-4 9-9 9z"/></svg>
        Consultar por WhatsApp
      </a>
    </div>
  </div>
</div>

<a class="float-wa" id="wa-float" href="#" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.6-1.5-.8-2-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.2L2 22l4.9-1.4c1.5.8 3.2 1.3 5.1 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.2.9.9-3.1-.2-.3C3.5 14 3 12.5 3 11c0-5 4-9 9-9s9 4 9 9-4 9-9 9z"/></svg>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/catalogo.js"></script>

</body>
</html>
