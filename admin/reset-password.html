<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>body{background:var(--paper);}</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="logo">--</div>
    <h1>Nueva contraseña</h1>
    <div class="login-sub">Escribe tu nueva contraseña para el panel</div>

    <div class="login-error" id="msg"></div>

    <form id="form-nueva">
      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" id="password1" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-guardar">Guardar nueva contraseña</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('form-nueva').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-guardar');
    const msg = document.getElementById('msg');
    msg.style.display = 'none';

    const p1 = document.getElementById('password1').value;
    const p2 = document.getElementById('password2').value;

    if (p1 !== p2) {
      msg.style.background = 'var(--red-tint)';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Las contraseñas no coinciden.';
      msg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const { error } = await actualizarPassword(p1);

    btn.disabled = false;
    btn.textContent = 'Guardar nueva contraseña';

    if (error) {
      msg.style.background = 'var(--red-tint)';
      msg.style.color = 'var(--red)';
      msg.textContent = 'El enlace expiró o no es válido. Solicita uno nuevo desde el login.';
      msg.style.display = 'block';
      return;
    }

    msg.style.background = 'var(--teal-tint)';
    msg.style.color = 'var(--teal-dark)';
    msg.textContent = 'Contraseña actualizada. Redirigiendo...';
    msg.style.display = 'block';

    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
  });
</script>

</body>
</html>
