<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>body{background:var(--paper);}</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="logo">--</div>
    <h1 id="titulo">Panel de administración</h1>
    <div class="login-sub">Ingresa con tu correo y contraseña</div>

    <div class="login-error" id="login-error"></div>
    <div class="login-error" id="recuperar-msg" style="background:var(--teal-tint);color:var(--teal-dark);"></div>

    <form id="form-login">
      <div class="field">
        <label>Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-login">Ingresar</button>
    </form>

    <div style="text-align:center;margin-top:14px;">
      <a href="#" id="link-olvide" style="font-size:12.5px;color:var(--ink-soft);text-decoration:underline;">¿Olvidaste tu contraseña?</a>
    </div>

    <form id="form-recuperar" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--paper-line);">
      <div class="field">
        <label>Correo para recuperar la contraseña</label>
        <input type="email" id="email-recuperar" required>
      </div>
      <button type="submit" class="btn btn-secondary btn-full" id="btn-recuperar">Enviar enlace de recuperación</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  redirigirSiYaHaySesion();

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    const { error } = await iniciarSesion(email, password);

    if (error) {
      errorBox.textContent = 'Correo o contraseña incorrectos.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }

    window.location.href = 'index.html';
  });

  // ---------- RECUPERAR CONTRASEÑA ----------
  document.getElementById('link-olvide').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('link-olvide').style.display = 'none';
    document.getElementById('form-recuperar').style.display = 'block';
  });

  document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-recuperar');
    const msg = document.getElementById('recuperar-msg');
    const email = document.getElementById('email-recuperar').value.trim();

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const { error } = await enviarRecuperacion(email);

    btn.disabled = false;
    btn.textContent = 'Enviar enlace de recuperación';

    if (error) {
      msg.style.background = 'var(--red-tint)';
      msg.style.color = 'var(--red)';
      msg.textContent = 'No se pudo enviar el correo. Intenta de nuevo.';
    } else {
      msg.style.background = 'var(--teal-tint)';
      msg.style.color = 'var(--teal-dark)';
      msg.textContent = 'Listo, revisa tu correo (y la carpeta de spam) para continuar.';
      document.getElementById('form-recuperar').reset();
    }
    msg.style.display = 'block';
  });
</script>

</body>
</html>
