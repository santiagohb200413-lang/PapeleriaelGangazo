<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>body{background:var(--paper);}</style>
</head>
<body>

<svg style="display:none">
  <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="ic-eye-off" viewBox="0 0 24 24"><path d="M17.9 17.9A10.6 10.6 0 0112 19c-7 0-11-7-11-7a19 19 0 015.1-5.6M9.9 4.2A9.8 9.8 0 0112 4c7 0 11 7 11 7a18.6 18.6 0 01-2.5 3.4"/><path d="M9.5 9.5a3 3 0 004.2 4.2"/><line x1="2" y1="2" x2="22" y2="22"/></symbol>
</svg>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="logo">--</div>
    <h1 id="titulo">Panel de administración</h1>
    <div class="login-sub">Ingresa con tu correo y contraseña</div>

    <div class="login-error" id="login-error"></div>

    <form id="form-login">
      <div class="field">
        <label>Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-target="password">
            <svg class="icon"><use href="#ic-eye"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-login">Ingresar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  redirigirSiYaHaySesion();

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    const { error } = await iniciarSesion(email, password);

    if (error) {
      errorBox.textContent = 'Correo o contraseña incorrectos.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }

    window.location.href = 'index.html';
  });

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => alternarVisibilidadPassword(btn));
  });
</script>

</body>
</html>
